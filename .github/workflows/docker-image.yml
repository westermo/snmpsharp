name: Docker Image CI

on:
  push:
    branches: [wmo]
  pull_request:
    branches: [wmo]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag westermo/snmpsharpnet && docker run --rm -t westermo/snmpsharpnet

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet run -c Release --project ./tests/SnmpSharpNet.Tests/SnmpSharpNet.Tests.csproj

  source-generator-integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run Net-SNMP interoperability tests
        run: >-
          docker compose
          --file tests/SnmpSharpNet.Mib.SourceGenerator.IntegrationTests/docker-compose.yml
          up --build --abort-on-container-exit --exit-code-from integration-tests
      - name: Tear down integration test containers
        if: always()
        run: >-
          docker compose
          --file tests/SnmpSharpNet.Mib.SourceGenerator.IntegrationTests/docker-compose.yml
          down --volumes --remove-orphans
